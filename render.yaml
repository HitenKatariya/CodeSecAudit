services:
  - type: web
    name: codesec-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: "8003"
      - key: CODESEC_ENABLE_RAG
        value: "true"
      - key: CODESEC_RAG_MODE
        value: remote
      - key: CODESEC_RAG_SERVICE_URL
        value: https://codesec-rag-service.onrender.com
      - key: CODESEC_DEFAULT_TOP_K
        value: "3"
      - key: CODESEC_MAX_FILES_PER_PR
        value: "30"
      - key: CODESEC_MAX_FILE_SIZE_KB
        value: "200"
      - key: CODESEC_MAX_INLINE_COMMENTS
        value: "10"
      - key: CODESEC_BLOCK_ON_REQUEST_CHANGES
        value: "false"
      - key: OWNER_CONTACT_EMAIL
        value: omchoksi108@gmail.com

  - type: web
    name: codesec-rag-service
    env: docker
    dockerfilePath: ./rag-service/Dockerfile
    dockerContext: ./rag-service
    envVars:
      - key: PORT
        value: "7860"
      - key: RAG_BUILD_ON_START
        value: "true"
      - key: RAG_DATASET_REPO
        value: hitenvk22/CodeSecAudit-RAG-Shuffled
      - key: RAG_CORPUS_FILE
        value: rag/rag_corpus.jsonl.gz
      - key: RAG_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2

  - type: web
    name: codesec-website
    env: docker
    dockerfilePath: ./website/Dockerfile
    dockerContext: ./website
    envVars:
      - key: PUBLIC_WEBSITE_URL
        value: https://codesec-website.onrender.com
      - key: CODESEC_API_URL
        value: https://codesec-backend.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://codesec-website.onrender.com/auth/github/callback
      - key: GITHUB_APP_SLUG
        value: codesecurityaudit-app
      - key: SESSION_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: codereview
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OWNER_CONTACT_EMAIL
        value: omchoksi108@gmail.com
      - key: FREE_PR_REVIEWS_PER_MONTH
        value: "30"
