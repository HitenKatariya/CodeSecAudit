[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesec-rag-server"
version = "0.1.0"
description = "Internal OWASP RAG retrieval and embedding microservice with Qdrant"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "qdrant-client==1.12.1",
    "grpcio==1.68.1",
    "grpcio-tools==1.68.1",
    "protobuf==5.29.1",
    "numpy==2.1.3",
    "redis==5.2.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
